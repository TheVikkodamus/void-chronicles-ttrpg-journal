// ── Password gate ──────────────────────────────────────────────────────────
(async function(){
  const HASH='28767e8782da837acdf6065424e8ef609042638603fb0d47131d0ae4b913998b';
  const SESSION_KEY='vc_auth';

  async function sha256(str){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  if(sessionStorage.getItem(SESSION_KEY)==='1')return;

  // Hide body until auth
  document.body.style.display='none';

  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:#020a04;display:flex;align-items:center;justify-content:center;z-index:99999;font-family:"Share Tech Mono","Courier New",monospace;';
  overlay.innerHTML=`
    <div style="border:1px solid #1e3d1e;padding:36px 40px;max-width:340px;width:100%;text-align:center;">
      <div style="font-family:VT323,monospace;font-size:32px;letter-spacing:6px;color:#fbbf24;text-shadow:0 0 20px rgba(251,191,36,0.4);margin-bottom:6px;">VOID CHRONICLES</div>
      <div style="font-size:9px;letter-spacing:3px;color:#3a5c3a;margin-bottom:28px;">WARDEN TERMINAL v2.5</div>
      <div style="font-size:9px;letter-spacing:2px;color:#3a5c3a;margin-bottom:10px;text-align:left;">ACCESS CODE</div>
      <input id="vc-pwd" type="password" autocomplete="current-password"
        style="width:100%;box-sizing:border-box;background:#071009;border:1px solid #1e3d1e;color:#86efac;font-family:inherit;font-size:14px;padding:10px 12px;outline:none;letter-spacing:2px;margin-bottom:10px;"
        placeholder="············"/>
      <div id="vc-err" style="font-size:9px;color:#f87171;letter-spacing:1px;min-height:16px;margin-bottom:10px;"></div>
      <button id="vc-btn"
        style="width:100%;padding:10px;background:none;border:1px solid #fbbf24;color:#fbbf24;font-family:inherit;font-size:11px;letter-spacing:4px;cursor:pointer;">
        AUTHENTICATE
      </button>
    </div>`;
  document.body.appendChild(overlay);
  document.body.style.display='block';

  async function attempt(){
    const val=document.getElementById('vc-pwd').value;
    const h=await sha256(val);
    if(h===HASH){
      sessionStorage.setItem(SESSION_KEY,'1');
      overlay.remove();
    } else {
      document.getElementById('vc-err').textContent='ACCESS DENIED';
      document.getElementById('vc-pwd').value='';
      document.getElementById('vc-pwd').focus();
      setTimeout(()=>document.getElementById('vc-err').textContent='',2000);
    }
  }

  document.getElementById('vc-btn').addEventListener('click',attempt);
  document.getElementById('vc-pwd').addEventListener('keydown',e=>{if(e.key==='Enter')attempt();});
  document.getElementById('vc-pwd').focus();
})();
</script>

function performRoll(sides,quantity,mode){
  if(mode==='advantage'||mode==='disadvantage'){
    const count=Math.max(quantity+1,2);
    const rolls=Array.from({length:count},()=>rollOne(sides));
    const sorted=[...rolls].sort((a,b)=>a-b);
    const kept=mode==='advantage'?sorted.slice(0,quantity):sorted.slice(count-quantity);
    const dropped=mode==='advantage'?[sorted[count-1]]:[sorted[0]];
    return{rolls,kept,dropped,total:kept.reduce((a,b)=>a+b,0),mode,sides,quantity};

  return{rolls,kept:rolls,dropped:[],total:rolls.reduce((a,b)=>a+b,0),mode,sides,quantity};
}

// ─── ENCOUNTER TAB ────────────────────────────────────────────────────────────
function EncounterTab({t,game,encounter,crew,bestiary,onUpdate}){
  const [showAdd,setShowAdd]=useState(false);
  const [addFilter,setAddFilter]=useState('crew');
  const enc=encounter||defaultEncounter();

  const upd=(changes)=>onUpdate({...enc,...changes});
  const updCombatants=(combatants)=>upd({combatants});

  const isMothership=game==='mothership';

  const buildCombatant=(source,type)=>{
    // For Mothership crew: hit boxes = Max Wounds (2-3 per rulebook)
    // For everything else: hit boxes = hp number
    let maxHits;
    if(isMothership&&type==='crew'){
      maxHits=parseHitBoxes(source.maxWounds||'2');
    } else {
      maxHits=parseHitBoxes(source.hp||'4');
    }
    return{
      id:uid(),
      sourceId:source.id,
      name:source.name||'UNKNOWN',
      type,
      role:source.role||source.category||'',
      initiative:0,
      maxHits,
      hits:Array(maxHits).fill(false),
      // Stats for display on encounter card
      speed:source.speed||'',
      // Armor: Mothership crew = armorPoints, Alien crew = armorLevel, monsters = armor
      armor:isMothership&&type==='crew'
        ?(source.armorPoints||'')
        :!isMothership&&type==='crew'
          ?(source.armorLevel||'')
          :(source.armor||''),
      armorType:source.armorType||'',
      attacks:source.attacks||'',
      wounds:source.wounds||'',
      // Mothership crew extras
      healthMax:source.healthMax||'',
      combat:source.combat||'',
      stressCur:source.stressCur||'',
      // Alien RPG crew extras
      resolve:source.resolve||'',
      stress:source.stress||'',
      category:source.category||'',
      status:source.status||'ACTIVE',
    };
  };

  const addCombatant=(source,type)=>{
    const c=buildCombatant(source,type);
    updCombatants([...enc.combatants,c]);
  };

  const duplicate=(original)=>{
    const copy={...original,id:uid(),hits:Array(original.maxHits).fill(false),name:original.name+' II'};
    // increment roman numeral suffix each dup
    const names=enc.combatants.map(c=>c.name);
    const romans=['II','III','IV','V','VI','VII','VIII'];
    const baseName=original.name.replace(/ (II|III|IV|V|VI|VII|VIII)$/,'');
    let finalName=baseName;
    for(const r of romans){
      const candidate=`${baseName} ${r}`;
      if(!names.includes(candidate)){finalName=candidate;break;}
    }
    copy.name=finalName;
    updCombatants([...enc.combatants,copy]);
  };

  const remove=(id)=>updCombatants(enc.combatants.filter(c=>c.id!==id));

  const toggleHit=(cid,hi)=>{
    updCombatants(enc.combatants.map(c=>{
      if(c.id!==cid)return c;
      const hits=[...c.hits];
      hits[hi]=!hits[hi];
      return{...c,hits};
    }));
  };

  // Quick +/- hit buttons: + marks next unchecked, - unmarks last checked
  const quickHit=(cid,dmg)=>{
    updCombatants(enc.combatants.map(c=>{
      if(c.id!==cid)return c;
      const hits=[...c.hits];
      if(dmg>0){
        const idx=hits.findIndex(h=>!h);
        if(idx>=0)hits[idx]=true;
      } else {
        const idx=[...hits].reverse().findIndex(h=>h);
        if(idx>=0)hits[hits.length-1-idx]=false;
      }
      return{...c,hits};
    }));
  };

  const setInitiative=(cid,val)=>{
    updCombatants(enc.combatants.map(c=>c.id===cid?{...c,initiative:parseInt(val)||0}:c));
  };

  const sorted=[...enc.combatants].sort((a,b)=>b.initiative-a.initiative);

  const nextTurn=()=>{
    if(!enc.combatants.length)return;
    const next=(enc.activeIndex+1)%sorted.length;
    const newRound=next===0?enc.round+1:enc.round;
    upd({activeIndex:next,round:newRound,started:true});
  };

  const prevTurn=()=>{
    if(!enc.combatants.length)return;
    const prev=(enc.activeIndex-1+sorted.length)%sorted.length;
    upd({activeIndex:prev,started:true});
  };

  const resetHp=()=>updCombatants(enc.combatants.map(c=>({...c,hits:Array(c.maxHits).fill(false)})));
  const clearAll=()=>onUpdate(defaultEncounter());

  const activeCombatant=sorted[enc.activeIndex];

  // Styles
  const S={
    topBar:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'16px',flexWrap:'wrap'},
    roundBox:{fontFamily:"'VT323',monospace",fontSize:'28px',color:t.a,letterSpacing:'4px',marginRight:'8px',textShadow:`0 0 12px rgba(${t.rgb},0.4)`},
    ctrl:(danger)=>({padding:'5px 12px',background:'none',border:`1px solid ${danger?'#f87171':t.bd}`,color:danger?'#f87171':t.mu,fontFamily:'inherit',fontSize:'9px',letterSpacing:'2px',borderRadius:'2px',cursor:'pointer',transition:'all 0.15s'}),
    addBtn:{padding:'5px 14px',background:'none',border:`1px solid ${t.a}`,color:t.a,fontFamily:'inherit',fontSize:'9px',letterSpacing:'2px',borderRadius:'2px',cursor:'pointer',marginLeft:'auto'},
    // combatant card
    card:(isActive,isDead)=>({
      background:isActive?`rgba(${t.rgb},0.06)`:t.card,
      border:`1px solid ${isActive?t.a:isDead?'#f87171':t.bd}`,

      boxShadow:isActive?`0 0 16px rgba(${t.rgb},0.12)`:'none',
      transition:'all 0.2s',
      position:'relative',
    }),
    activePip:{position:'absolute',top:'12px',left:'-1px',width:'3px',height:'calc(100% - 24px)',background:t.a,borderRadius:'2px 0 0 2px'},
    cardTop:{display:'flex',alignItems:'flex-start',gap:'10px',marginBottom:'8px'},
    initBox:{display:'flex',flexDirection:'column',alignItems:'center',gap:'2px',minWidth:'36px'},
    initLbl:{fontSize:'7px',letterSpacing:'1px',color:t.mu},
    initInp:{width:'36px',background:t.bg,border:`1px solid ${t.bd}`,borderRadius:'2px',padding:'3px 4px',color:t.a,fontFamily:"'VT323',monospace",fontSize:'20px',textAlign:'center',outline:'none'},
    nameBlock:{flex:1},
    nameStr:{fontSize:'13px',letterSpacing:'1px',color:t.tx,marginBottom:'3px'},
    roleStr:{fontSize:'9px',color:t.mu,letterSpacing:'1px'},
    typeBadge:(type)=>({display:'inline-block',padding:'1px 6px',fontSize:'8px',letterSpacing:'1px',border:`1px solid ${TYPE_C[type]||t.mu}`,color:TYPE_C[type]||t.mu,borderRadius:'2px',marginLeft:'6px'}),
    catBadge:(cat)=>({display:'inline-block',padding:'1px 5px',fontSize:'7px',letterSpacing:'1px',border:`1px solid ${CATEGORY_C[cat]||t.mu}`,color:CATEGORY_C[cat]||t.mu,borderRadius:'2px',marginLeft:'4px'}),
    btnGroup:{display:'flex',gap:'4px',flexShrink:0},
    smBtn:(danger)=>({padding:'3px 8px',background:'none',border:`1px solid ${danger?'#f87171':t.bd}`,color:danger?'#f87171':t.mu,fontFamily:'inherit',fontSize:'8px',letterSpacing:'1px',borderRadius:'2px',cursor:'pointer'}),
    dupBtn:{padding:'3px 8px',background:'none',border:`1px solid ${t.a}`,color:t.a,fontFamily:'inherit',fontSize:'8px',letterSpacing:'1px',borderRadius:'2px',cursor:'pointer'},
    statsRow:{display:'flex',gap:'8px',marginBottom:'8px',flexWrap:'wrap'},
    statPill:(label,val)=>null, // computed inline
    hitsRow:{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'},
    hitBox:(filled)=>({width:'14px',height:'14px',border:`1px solid ${filled?'#f87171':t.bd}`,borderRadius:'2px',background:filled?'#f87171':'none',cursor:'pointer',display:'inline-block',flexShrink:0,transition:'all 0.1s'}),
    hpCounter:{fontFamily:"'VT323',monospace",fontSize:'16px',color:t.mu,marginLeft:'4px'},
    qBtn:{width:'22px',height:'22px',background:'none',border:`1px solid ${t.bd}`,color:t.mu,fontFamily:'inherit',fontSize:'14px',borderRadius:'2px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1},
    attackPrev:{fontSize:'9px',color:t.mu,letterSpacing:'1px',marginTop:'6px',borderTop:`1px solid ${t.bd}`,paddingTop:'6px',lineHeight:'1.5'},
    // add panel
    addPanel:{background:t.card,border:`1px solid ${t.bd}`,borderRadius:'2px',padding:'16px',marginBottom:'16px'},
    filterRow:{display:'flex',gap:'6px',marginBottom:'12px'},
    filterBtn:(active)=>({padding:'5px 14px',background:active?`rgba(${t.rgb},0.06)`:'none',border:`1px solid ${active?t.a:t.bd}`,color:active?t.a:t.mu,fontFamily:'inherit',fontSize:'9px',letterSpacing:'2px',borderRadius:'2px',cursor:'pointer'}),
    sourceList:{display:'flex',flexDirection:'column',gap:'6px',maxHeight:'240px',overflowY:'auto'},
    sourceRow:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',background:t.bg,border:`1px solid ${t.bd}`,borderRadius:'2px',cursor:'pointer',transition:'border-color 0.15s'},
    sourceName:{fontSize:'11px',color:t.tx,letterSpacing:'1px'},
    sourceMeta:{fontSize:'9px',color:t.mu},
    empty:{textAlign:'center',padding:'30px',color:t.mu,fontSize:'10px',letterSpacing:'2px'},
  };

  const statTag=(label,val)=>val?React.createElement('span',{style:{fontSize:'9px',color:t.mu,border:`1px solid ${t.bd}`,padding:'2px 6px',borderRadius:'2px',letterSpacing:'1px'}},
    React.createElement('span',{style:{color:t.mu,marginRight:'3px'}},label+':'),
    React.createElement('span',{style:{color:t.tx}},val)
  ):null;

  const renderCombatant=(c,idx)=>{
    const isActive=enc.started&&sorted[enc.activeIndex]?.id===c.id;
    const hitCount=c.hits.filter(Boolean).length;
    const isDead=hitCount>=c.maxHits;
    return React.createElement('div',{key:c.id,style:S.card(isActive,isDead)},
      isActive&&React.createElement('div',{style:S.activePip}),
      // Top row: initiative | name | badges | buttons
      React.createElement('div',{style:S.cardTop},
        React.createElement('div',{style:S.initBox},
          React.createElement('div',{style:S.initLbl},'INIT'),

            c.category&&React.createElement('span',{style:S.catBadge(c.category)},c.category)
          ),
          c.role&&React.createElement('div',{style:S.roleStr},c.role)

    // ── Top bar ──
    React.createElement('div',{style:S.topBar},

      React.createElement('div',{style:{fontSize:'9px',letterSpacing:'3px',color:t.mu,marginBottom:'10px'}},'SELECT FROM ROSTER'),

                )
              ),

            ))
          )
    ),

    // ── Active turn banner ──
    enc.started&&activeCombatant&&React.createElement('div',{style:{background:`rgba(${t.rgb},0.05)`,border:`1px solid ${t.a}`,borderRadius:'2px',padding:'8px 14px',marginBottom:'12px',display:'flex',justifyContent:'space-between',alignItems:'center'}},
      React.createElement('span',{style:{fontSize:'9px',letterSpacing:'3px',color:t.mu}},'ACTIVE TURN'),
      React.createElement('span',{style:{fontFamily:"'VT323',monospace",fontSize:'18px',color:t.a,letterSpacing:'2px'}},activeCombatant.name),
      React.createElement('span',{style:{fontSize:'9px',letterSpacing:'2px',color:t.mu}},`ROUND ${enc.round}`)
    ),

    // ── Combatant list ──

          'NO COMBATANTS',React.createElement('br'),
          React.createElement('span',{style:{fontSize:'9px',opacity:0.5}},'PRESS + ADD COMBATANTS TO BEGIN')
        )
      : sorted.map((c,i)=>renderCombatant(c,i))
  );
}

function RulesTab({t,game,homebrew,onHomebrewChange}){

    header:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 16px',
      cursor:'pointer',background:t.card,transition:'background 0.15s'},
    headerOpen:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 16px',
      cursor:'pointer',background:`rgba(${t.rgb},0.06)`,transition:'background 0.15s'},
    title:{fontSize:'11px',letterSpacing:'3px',color:t.tx},
    titleOpen:{fontSize:'11px',letterSpacing:'3px',color:t.a},
    chevron:(open)=>({fontSize:'12px',color:open?t.a:t.mu,transition:'transform 0.2s',
      display:'inline-block',transform:open?'rotate(90deg)':'rotate(0deg)'}),
    quickRef:{padding:'12px 16px',background:t.bg,borderBottom:`1px solid ${t.bd}`,
      fontFamily:"'Share Tech Mono',monospace",fontSize:'11px',color:t.tx,
      lineHeight:'1.8',letterSpacing:'0.5px',whiteSpace:'pre-wrap'},
    expandBtn:{display:'block',width:'100%',padding:'8px 16px',background:'none',
      border:'none',borderTop:`1px solid ${t.bd}`,color:t.mu,fontFamily:'inherit',
      fontSize:'9px',letterSpacing:'2px',cursor:'pointer',textAlign:'left',
      transition:'color 0.15s'},
    fullDetail:{padding:'14px 16px',background:t.bg,
      fontFamily:"'Share Tech Mono',monospace",fontSize:'11px',color:t.mu,
      lineHeight:'1.9',letterSpacing:'0.5px',whiteSpace:'pre-wrap',
      borderTop:`1px dashed ${t.bd}`},
    intro:{background:t.card,border:`1px solid ${t.bd}`,borderRadius:'2px',
      padding:'14px 16px',marginBottom:'16px',fontSize:'10px',color:t.mu,
      letterSpacing:'1px',lineHeight:'1.7'},
  };

  const [expandedFull,setExpandedFull]=useState({});
  const toggleFull=(id)=>setExpandedFull(p=>({...p,[id]:!p[id]}));

  // ── Homebrew state ──
  const [hbForm,setHbForm]=useState(null); // null=closed, {}=new, {id,...}=editing
  const [hbExpanded,setHbExpanded]=useState({});
  const [hbDeleteConfirm,setHbDeleteConfirm]=useState(null);

  const hbEntries=homebrew||[];

  const saveHb=()=>{
    if(!hbForm||!hbForm.title?.trim())return;
    const entries=[...hbEntries];
    if(hbForm.id){
      const i=entries.findIndex(x=>x.id===hbForm.id);
      if(i>=0)entries[i]={...hbForm};
    } else {
      entries.push({...hbForm,id:uid(),createdAt:Date.now()});
    }
    onHomebrewChange(entries);
    setHbForm(null);
  };

  const deleteHb=(id)=>{
    onHomebrewChange(hbEntries.filter(x=>x.id!==id));
    setHbDeleteConfirm(null);
  };

  const HB_CATS=['COMBAT','SKILLS','STRESS & PANIC','ARMOR','EQUIPMENT','CREATURES','HOUSE RULE','OTHER'];

  return React.createElement('div',null,

const MOOD_OPTS=['AMBIENT','EXPLORATION','TENSION','COMBAT','HORROR','OTHER'];

function getYTId(url){
  if(!url)return null;
  // Handle youtu.be, youtube.com/watch, youtube.com/embed
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([A-Za-z0-9_-]{11})/);
  return m?m[1]:null;
}

function MusicTab({t,game,playlist,onPlaylistChange,activeTrackId,onTrackChange}){
  const [addForm,setAddForm]=useState(null);
  const [form,setForm]=useState({});
  const [editId,setEditId]=useState(null);
  const [delId,setDelId]=useState(null);
  const [filterMood,setFilterMood]=useState('ALL');

  const tracks=playlist||[];
  const filtered=filterMood==='ALL'?tracks:tracks.filter(tr=>tr.mood===filterMood);
  const activeId=activeTrackId;
  const setActiveId=onTrackChange;

  const saveTrack=()=>{
    if(!form.title?.trim()||!form.url?.trim())return;
    const ytId=getYTId(form.url);
    if(!ytId){alert('Could not find a YouTube video ID in that URL. Please check the link.');return;}
    const entry={...form,ytId,id:editId||uid(),createdAt:Date.now()};
    let updated;
    if(editId){
      updated=tracks.map(t=>t.id===editId?entry:t);
    } else {
      updated=[...tracks,entry];
    }
    onPlaylistChange(updated);
    setAddForm(null);setForm({});setEditId(null);
  };

  const del=(id)=>{
    onPlaylistChange(tracks.filter(tr=>tr.id!==id));
    if(activeTrackId===id)onTrackChange(null);
    setDelId(null);
  };

  const openEdit=(track)=>{
    setForm({...track});setEditId(track.id);setAddForm('edit');
  };

  const S={
    intro:{background:t.card,border:`1px solid ${t.bd}`,borderRadius:'2px',

    ),

      React.createElement('div',{style:{fontSize:'10px',letterSpacing:'4px',color:t.mu}},
        `${tracks.length} TRACK${tracks.length!==1?'S':''}`
      ),
      React.createElement('button',{style:S.addBtn,onClick:()=>{setForm({mood:'AMBIENT'});setEditId(null);setAddForm('add');}},

                  onClick:(e)=>{e.stopPropagation();openEdit(track);}},'EDIT'),

// Load/save per-member session state from localStorage
function loadSheetState(memberId){
  try{
    const raw=localStorage.getItem(SHEET_KEY);
    const all=raw?JSON.parse(raw):{};
    return all[memberId]||null;
  }catch{return null;}
}
function saveSheetState(memberId,state){
  try{
    const raw=localStorage.getItem(SHEET_KEY);
    const all=raw?JSON.parse(raw):{};
    all[memberId]=state;
    localStorage.setItem(SHEET_KEY,JSON.stringify(all));
  }catch{}
}
function clearSheetState(memberId){
  try{
    const raw=localStorage.getItem(SHEET_KEY);
    const all=raw?JSON.parse(raw):{};
    delete all[memberId];
    localStorage.setItem(SHEET_KEY,JSON.stringify(all));
  }catch{}
}
const SHEET_KEY='vc-sheet-state-v1';

function App(){
  const [game,setGame]=useState('mothership');
  const [tab,setTab]=useState('sessions');
  const [data,setData]=useState({mothership:defaultData(),alien:defaultData()});
  const [loaded,setLoaded]=useState(false);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [delConfirm,setDelConfirm]=useState(null);
  const [importError,setImportError]=useState(null);
  const [importSuccess,setImportSuccess]=useState(false);
  const t=THEMES[game];

  const exportData=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`void-chronicles-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importData=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!parsed.mothership||!parsed.alien)throw new Error('Invalid');
        ['mothership','alien'].forEach(g=>{
          if(!parsed[g].bestiary)parsed[g].bestiary=[];
          if(!parsed[g].encounter)parsed[g].encounter=defaultEncounter();
          if(!parsed[g].homebrew)parsed[g].homebrew=[];
        });
        upd(parsed);
        setImportSuccess(true);setImportError(null);
        setTimeout(()=>setImportSuccess(false),3000);
      }catch{
        setImportError('INVALID FILE -- IMPORT FAILED');
        setTimeout(()=>setImportError(null),3000);
      }
    };
    reader.readAsText(file);
    e.target.value='';
  };

  useEffect(()=>{
    (async()=>{
      try{
        const r=await storage.get(STORAGE_KEY);
        if(r){
          const parsed=JSON.parse(r.value);
          ['mothership','alien'].forEach(g=>{
            if(!parsed[g].bestiary)parsed[g].bestiary=[];
            if(!parsed[g].encounter)parsed[g].encounter=defaultEncounter();
          if(!parsed[g].homebrew)parsed[g].homebrew=[];
          });
          setData(parsed);
        }
      }catch{}
      setLoaded(true);
    })();
  },[]);

  const save=async(d)=>{try{await storage.set(STORAGE_KEY,JSON.stringify(d));}catch{}};
  const upd=(d)=>{setData(d);save(d);};
  const gd=()=>data[game];

  const getFields=(tid)=>{
    if(tid==='crew')return FIELDS[`crew_${game}`]||[];
    if(tid==='bestiary')return FIELDS[`bestiary_${game}`]||[];
    return FIELDS[tid]||[];
  };

  const updateEncounter=(enc)=>{
    const nd={...data,[game]:{...gd(),encounter:enc}};
    upd(nd);
  };

  const updateHomebrew=(entries)=>{
    const nd={...data,[game]:{...gd(),homebrew:entries}};
    upd(nd);
  };



  const openAdd=()=>{setForm({});setModal({mode:'add',tab});};
  const openEdit=(item)=>{setForm({...item});setModal({mode:'edit',tab,item});};
  const openView=(item)=>{setModal({mode:'view',tab,item});};

  const saveItem=()=>{
    const req=getFields(modal.tab).find(f=>f.req);
    if(req&&!form[req.k]?.trim())return;
    const items=[...(gd()[modal.tab]||[])];
    if(modal.mode==='add')items.push({...form,id:uid(),createdAt:Date.now()});
    else{const i=items.findIndex(x=>x.id===modal.item.id);if(i>=0)items[i]={...items[i],...form};}
    const nd={...data,[game]:{...gd(),[modal.tab]:items}};
    upd(nd);setModal(null);

    upd(nd);setDelConfirm(null);setModal(null);
