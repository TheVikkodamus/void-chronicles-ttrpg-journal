(async function(){
  const HASH='28767e8782da837acdf6065424e8ef609042638603fb0d47131d0ae4b913998b';
  const SESSION_KEY='vc_auth';
  async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}

  document.body.appendChild(overlay);document.body.style.display='block';
  async function attempt(){const val=document.getElementById('vc-pwd').value;const h=await sha256(val);if(h===HASH){sessionStorage.setItem(SESSION_KEY,'1');overlay.remove();}else{document.getElementById('vc-err').textContent='ACCESS DENIED';document.getElementById('vc-pwd').value='';document.getElementById('vc-pwd').focus();setTimeout(()=>document.getElementById('vc-err').textContent='',2000);}}

  document.getElementById('vc-pwd').addEventListener('keydown',e=>{if(e.key==='Enter')attempt();});
  document.getElementById('vc-pwd').focus();
})();

function rollOne(sides){return Math.floor(Math.random()*sides)+1;}
function performRoll(sides,quantity,mode){
  if(mode==='advantage'||mode==='disadvantage'){
    const count=Math.max(quantity+1,2);
    const rolls=Array.from({length:count},()=>rollOne(sides));
    const sorted=[...rolls].sort((a,b)=>a-b);
    const kept=mode==='advantage'?sorted.slice(0,quantity):sorted.slice(count-quantity);
    const dropped=mode==='advantage'?[sorted[count-1]]:[sorted[0]];
    return{rolls,kept,dropped,total:kept.reduce((a,b)=>a+b,0),mode,sides,quantity};
  }
  const rolls=Array.from({length:quantity},()=>rollOne(sides));
  return{rolls,kept:rolls,dropped:[],total:rolls.reduce((a,b)=>a+b,0),mode,sides,quantity};
}
